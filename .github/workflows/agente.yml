name: Agente Financiero Diario

on:
  schedule:
    - cron: '0 23 * * 1-5' # Se ejecuta de Lunes a Viernes a las 11:00 PM (hora de cierre de mercado)
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar Dependencias
        run: pip install pandas numpy yfinance
      - name: Ejecutar Agente
        run: python agente_financiero.py
